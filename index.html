<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal CCTV Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dashboard-bg': '#0f1115',
                        'panel-bg': '#1a1d24',
                        'alert-red': '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        .camera-feed {
            background-image: repeating-linear-gradient(
                45deg,
                #1a1d24 25%,
                transparent 25%,
                transparent 75%,
                #1a1d24 75%,
                #1a1d24
            ),
            repeating-linear-gradient(
                45deg,
                #1a1d24 25%,
                #222630 25%,
                #222630 75%,
                #1a1d24 75%,
                #1a1d24
            );
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .camera-feed::after {
            content: "NO SIGNAL";
            color: #4b5563;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            position: absolute;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            position: absolute;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.1) 51%, rgba(0,0,0,0));
            animation: scroll 4s infinite linear;
        }

        @keyframes scroll {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(100vh); }
        }
    </style>
</head>
<body class="bg-dashboard-bg text-gray-300 font-sans h-screen flex flex-col overflow-hidden selection:bg-gray-700">

    <!-- Top Header -->
    <header class="bg-panel-bg border-b border-gray-800 px-6 py-4 flex items-center justify-between shrink-0 shadow-sm z-20">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
            <h1 class="text-xl font-medium tracking-wide text-gray-100">CCTV<span class="text-gray-500 font-light"> // MONITORING</span></h1>
        </div>

        <div class="flex items-center gap-6 text-sm text-gray-400">
            <div class="flex flex-col text-right">
                <span class="font-mono text-gray-200" id="current-time">00:00:00</span>
                <span class="text-xs" id="current-date">YYYY-MM-DD</span>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex flex-1 overflow-hidden">

        <!-- Camera Grid -->
        <div class="flex-1 p-4 grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto custom-scrollbar">

            <!-- Camera 1 -->
            <div class="relative bg-panel-bg rounded-lg border border-gray-800 overflow-hidden flex flex-col group transition-all duration-300 shadow-sm hover:border-gray-600" id="cam-1">
                <div class="px-3 py-2 border-b border-gray-800 flex justify-between items-center bg-panel-bg z-20">
                    <span class="text-xs font-semibold text-gray-400 tracking-wider">CAM 01 // MAIN ENTRANCE</span>
                    <span class="w-2 h-2 rounded-full bg-green-500 status-indicator"></span>
                </div>
                <div class="flex-1 camera-feed w-full h-48 relative overflow-hidden">
                     <div class="scanline"></div>
                </div>
            </div>

            <!-- Camera 2 -->
            <div class="relative bg-panel-bg rounded-lg border border-gray-800 overflow-hidden flex flex-col group transition-all duration-300 shadow-sm hover:border-gray-600" id="cam-2">
                <div class="px-3 py-2 border-b border-gray-800 flex justify-between items-center bg-panel-bg z-20">
                    <span class="text-xs font-semibold text-gray-400 tracking-wider">CAM 02 // PARKING LOT A</span>
                    <span class="w-2 h-2 rounded-full bg-green-500 status-indicator"></span>
                </div>
                <div class="flex-1 camera-feed w-full h-48 relative overflow-hidden">
                    <div class="scanline"></div>
                </div>
            </div>

            <!-- Camera 3 -->
            <div class="relative bg-panel-bg rounded-lg border border-gray-800 overflow-hidden flex flex-col group transition-all duration-300 shadow-sm hover:border-gray-600" id="cam-3">
                <div class="px-3 py-2 border-b border-gray-800 flex justify-between items-center bg-panel-bg z-20">
                    <span class="text-xs font-semibold text-gray-400 tracking-wider">CAM 03 // SERVER ROOM</span>
                    <span class="w-2 h-2 rounded-full bg-green-500 status-indicator"></span>
                </div>
                <div class="flex-1 camera-feed w-full h-48 relative overflow-hidden">
                    <div class="scanline"></div>
                </div>
            </div>

            <!-- Camera 4 -->
            <div class="relative bg-panel-bg rounded-lg border border-gray-800 overflow-hidden flex flex-col group transition-all duration-300 shadow-sm hover:border-gray-600" id="cam-4">
                <div class="px-3 py-2 border-b border-gray-800 flex justify-between items-center bg-panel-bg z-20">
                    <span class="text-xs font-semibold text-gray-400 tracking-wider">CAM 04 // LOBBY DESK</span>
                    <span class="w-2 h-2 rounded-full bg-green-500 status-indicator"></span>
                </div>
                <div class="flex-1 camera-feed w-full h-48 relative overflow-hidden">
                     <div class="scanline"></div>
                </div>
            </div>

            <!-- Camera 5 -->
            <div class="relative bg-panel-bg rounded-lg border border-gray-800 overflow-hidden flex flex-col group transition-all duration-300 shadow-sm hover:border-gray-600" id="cam-5">
                <div class="px-3 py-2 border-b border-gray-800 flex justify-between items-center bg-panel-bg z-20">
                    <span class="text-xs font-semibold text-gray-400 tracking-wider">CAM 05 // WAREHOUSE BACK</span>
                    <span class="w-2 h-2 rounded-full bg-green-500 status-indicator"></span>
                </div>
                <div class="flex-1 camera-feed w-full h-48 relative overflow-hidden">
                     <div class="scanline"></div>
                </div>
            </div>

            <!-- Camera 6 -->
            <div class="relative bg-panel-bg rounded-lg border border-gray-800 overflow-hidden flex flex-col group transition-all duration-300 shadow-sm hover:border-gray-600" id="cam-6">
                <div class="px-3 py-2 border-b border-gray-800 flex justify-between items-center bg-panel-bg z-20">
                    <span class="text-xs font-semibold text-gray-400 tracking-wider">CAM 06 // CAFETERIA</span>
                    <span class="w-2 h-2 rounded-full bg-green-500 status-indicator"></span>
                </div>
                <div class="flex-1 camera-feed w-full h-48 relative overflow-hidden">
                     <div class="scanline"></div>
                </div>
            </div>

        </div>

        <!-- Sidebar / Alerts Panel -->
        <aside class="w-80 bg-panel-bg border-l border-gray-800 flex flex-col shadow-lg z-20 relative">
            <div class="px-5 py-4 border-b border-gray-800 flex items-center justify-between">
                <h2 class="text-sm font-medium tracking-wider text-gray-200">SYSTEM ALERTS</h2>
                <span class="bg-gray-800 text-gray-300 text-xs px-2 py-1 rounded-md font-mono" id="alert-count">0 ACTIVE</span>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-3" id="alert-container">
                <!-- Alerts will be injected here -->
                <div class="text-center text-sm text-gray-500 py-10" id="empty-state">
                    No active alerts.<br>System normal.
                </div>
            </div>

            <!-- Quick Actions Footer -->
            <div class="p-4 border-t border-gray-800">
                <button id="test-alert-btn" class="w-full py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded text-xs font-medium tracking-wide transition-colors border border-gray-700 hover:border-gray-600">
                    SIMULATE EVENT
                </button>
            </div>
        </aside>

    </main>

    <script src="app.js"></script>
</body>
</html>
